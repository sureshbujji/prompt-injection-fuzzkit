[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-injection-fuzzkit"
version = "0.1.0"
description = "Fuzz harness that mutates prompt-injection payloads to stress-test LLM app defenses, with a defense scorecard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Suresh Itha" }]

[project.scripts]
fuzzkit = "prompt_injection_fuzzkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
